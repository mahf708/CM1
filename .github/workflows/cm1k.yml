# cm1k: C++/Kokkos port of CM1 (cxx/), tested against Fortran reference dumps.
#
# Jobs:
#   fortran-refs         build the Fortran (double precision) and run every case in
#                        cxx/cases with the dump hook; upload the dumps as artifact
#                        `cm1-refs` (layout: cxx/cases/README.md). Cached by the hash
#                        of src/, cxx/cases/ and the scripts that make the dumps.
#   fortran-determinism  run-to-run and OpenMP thread-count reproducibility of the
#                        Fortran dumps (cxx/scripts/check_determinism.sh).
#   cm1k                 build cm1k and run ctest against the references, for the
#                        Kokkos OpenMP (Release) and Serial (Debug + bounds checks)
#                        backends; the OpenMP leg also runs cxx/scripts/ci_python.sh.
#   cm1k-cuda-compile    compile-only check for CUDA (no GPU on hosted runners),
#                        with CM1K_ENABLE_MPI=ON.
#   fortran-refs-mpi     build the Fortran with MPI and run the cases that have a
#                        `ranks` file on 2 and 4 ranks (cxx/scripts/make_refs_mpi.sh);
#                        artifact `cm1-refs-mpi`, cached like fortran-refs.
#   cm1k-mpi             build cm1k with CM1K_ENABLE_MPI=ON and run the MPI tests on
#                        2 and 4 ranks against both reference sets, then the rest.
name: cm1k

on:
  push:
    branches:
      - "claude/**"
      - "cm1k/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cm1k-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to invalidate the reference cache without touching the sources.
  REFS_CACHE_VERSION: v2
  # glibc picks libm/libmvec code paths (FMA, AVX2, ...) by CPU at run time,
  # and those paths can differ in the last bit. The references are made on one
  # runner and compared on another, so pin every job to the same baseline paths.
  GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX512F,-AVX2,-FMA,-FMA4
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  # OpenMPI on hosted runners: allow more ranks than cores.
  OMPI_MCA_rmaps_base_oversubscribe: 1

jobs:
  fortran-refs:
    name: Fortran reference dumps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached references
        id: cache
        uses: actions/cache@v4
        with:
          path: refs
          key: cm1-refs-${{ env.REFS_CACHE_VERSION }}-${{ hashFiles('src/**', 'cxx/cases/**', 'cxx/scripts/make_refs.sh') }}

      - name: Install Fortran toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libnetcdff-dev libopenmpi-dev

      - name: Build Fortran CM1 and write reference dumps
        if: steps.cache.outputs.cache-hit != 'true'
        run: JOBS=4 cxx/scripts/make_refs.sh refs

      - name: Show manifest
        run: |
          cat refs/MANIFEST.txt
          du -sh refs/*

      - name: Upload references
        uses: actions/upload-artifact@v4
        with:
          name: cm1-refs
          path: refs
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

  fortran-determinism:
    name: Fortran reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libnetcdff-dev libopenmpi-dev python3-numpy

      - name: Run twice, and with 1 and 2 OpenMP threads
        run: JOBS=4 cxx/scripts/check_determinism.sh "$RUNNER_TEMP/det" dry_shear kessler_tke kessler_saturated kessler_periodic

  cm1k:
    name: cm1k (${{ matrix.name }})
    needs: fortran-refs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openmp-release
            build_type: Release
            cmake_args: -DKokkos_ENABLE_OPENMP=ON
            python: true
            max_step: ""
          - name: serial-debug
            build_type: Debug
            cmake_args: -DKokkos_ENABLE_DEBUG_BOUNDS_CHECK=ON
            python: false
            # bounds-checked Debug is ~20x slower: compare dumps up to step 10
            max_step: "10"
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
      OMP_NUM_THREADS: 2
      CM1K_REQUIRE_REFS: 1
      CM1K_MAX_STEP: ${{ matrix.max_step }}
      OMP_PROC_BIND: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules (EKAT, Kokkos)
        run: |
          # EKAT's Kokkos submodule has an ssh URL; fetch it over https.
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 cxx/externals/ekat

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran g++ cmake ninja-build ccache libopenmpi-dev openmpi-bin \
            python3-dev python3-numpy python3-pytest pybind11-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cm1k-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-cm1k-${{ matrix.name }}-

      - name: Download references
        uses: actions/download-artifact@v4
        with:
          name: cm1-refs
          path: refs

      - name: Configure
        run: |
          cmake -S cxx -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCM1K_REF_DIR="$GITHUB_WORKSPACE/refs" \
            ${{ matrix.cmake_args }}

      - name: Build
        run: |
          ccache -z
          cmake --build build -j4
          ccache -s

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 1800

      - name: Python bindings
        if: matrix.python
        env:
          CM1K_REF_DIR: ${{ github.workspace }}/refs
        run: |
          if [ -f cxx/scripts/ci_python.sh ]; then
            bash cxx/scripts/ci_python.sh
          else
            echo "cxx/scripts/ci_python.sh not present; skipping Python tests"
          fi

  cm1k-cuda-compile:
    name: cm1k (CUDA, compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates g++ cmake ninja-build ccache libopenmpi-dev openmpi-bin

      - uses: actions/checkout@v4

      - name: Checkout submodules (EKAT, Kokkos)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 cxx/externals/ekat

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cm1k-cuda-${{ github.sha }}
          restore-keys: |
            ccache-cm1k-cuda-

      - name: Configure
        run: |
          cmake -S cxx -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$GITHUB_WORKSPACE/cxx/externals/ekat/extern/kokkos/bin/nvcc_wrapper" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKokkos_ENABLE_CUDA=ON \
            -DKokkos_ARCH_AMPERE80=ON \
            -DCM1K_ENABLE_MPI=ON \
            -DCM1K_ENABLE_FORTRAN_BRIDGE=OFF \
            -DCM1K_ENABLE_TESTS=ON

      - name: Build (no GPU on hosted runners; tests are built, not run)
        run: |
          ccache -z
          cmake --build build -j4
          ccache -s

  fortran-refs-mpi:
    name: Fortran MPI reference dumps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached MPI references
        id: cache
        uses: actions/cache@v4
        with:
          path: refs-mpi
          key: cm1-refs-mpi-${{ env.REFS_CACHE_VERSION }}-${{ hashFiles('src/**', 'cxx/cases/**', 'cxx/scripts/make_refs.sh', 'cxx/scripts/make_refs_mpi.sh') }}

      - name: Install Fortran and MPI toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libnetcdff-dev libopenmpi-dev openmpi-bin

      - name: Build Fortran CM1 (MPI) and write per-rank reference dumps
        if: steps.cache.outputs.cache-hit != 'true'
        run: JOBS=4 cxx/scripts/make_refs_mpi.sh refs-mpi

      - name: Show manifest
        run: |
          cat refs-mpi/MANIFEST_MPI.txt
          du -sh refs-mpi/*

      - name: Upload MPI references
        uses: actions/upload-artifact@v4
        with:
          name: cm1-refs-mpi
          path: refs-mpi
          if-no-files-found: error
          retention-days: 5
          compression-level: 6

  cm1k-mpi:
    name: cm1k (MPI, 2 and 4 ranks)
    needs: [fortran-refs, fortran-refs-mpi]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
      # one thread per rank (4 ranks on a 4-core runner)
      OMP_NUM_THREADS: 1
      CM1K_REQUIRE_REFS: 1
      OMP_PROC_BIND: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules (EKAT, Kokkos)
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 cxx/externals/ekat

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran g++ cmake ninja-build ccache libopenmpi-dev openmpi-bin

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cm1k-mpi-${{ github.sha }}
          restore-keys: |
            ccache-cm1k-mpi-

      # one directory holds both: refs/<case>/step_* (serial, for the interior
      # comparison) and refs/<case>/np<N>/rank_RRRR/step_* (per rank)
      - name: Download serial references
        uses: actions/download-artifact@v4
        with:
          name: cm1-refs
          path: refs

      - name: Download MPI references
        uses: actions/download-artifact@v4
        with:
          name: cm1-refs-mpi
          path: refs

      - name: Configure
        run: |
          cmake -S cxx -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCM1K_REF_DIR="$GITHUB_WORKSPACE/refs" \
            -DKokkos_ENABLE_OPENMP=ON \
            -DCM1K_ENABLE_MPI=ON

      - name: Build
        run: |
          ccache -z
          cmake --build build -j4
          ccache -s

      - name: MPI tests (2 and 4 ranks, bitwise per rank)
        working-directory: build
        run: ctest -L mpi --output-on-failure --timeout 3600

      - name: Other tests (MPI build, serial runs)
        working-directory: build
        env:
          OMP_NUM_THREADS: 2
        run: ctest -LE mpi --output-on-failure --timeout 1800
